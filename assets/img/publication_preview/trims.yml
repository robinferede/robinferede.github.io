# Trim settings for paper preview videos.
#
# To regenerate one:
#   ffmpeg -y -ss <start> -t <end - start> -i <source> \
#     -vf "scale=<width>:-2" -an -c:v libx264 -crf <crf> -preset <preset> \
#     -pix_fmt yuv420p -movflags +faststart <output>

defaults:
  width: 1000
  crf: 23
  preset: slow

clips:
  skydreamer.mp4:
    youtube: https://www.youtube.com/watch?v=GiIjs_MmMrg
    source: youtube/skydreamer.mp4
    start: 0.3
    end: 16.5

  monorace.mp4:
    youtube: https://www.youtube.com/watch?v=yz2in2eFATE
    source: youtube/monorace.mp4
    start: 40.3
    end: 59.5

  onenet.mp4:
    youtube: https://www.youtube.com/watch?v=-HlyiX6TL1M
    source: youtube/onenet.mp4
    start: 22
    end: 47

  e2e_rl.mp4:
    youtube: https://www.youtube.com/watch?v=jwQ33_vJVos
    source: youtube/e2e_rl.mp4
    start: 28
    end: 37
    vf_extra: "eq=contrast=1.4:saturation=1.5:gamma=0.95"

  gcnet.mp4:
    youtube: https://www.youtube.com/watch?v=FrwpODT0HKQ
    source: youtube/gcnet.mp4
    start: 51
    end: 84

  e2e_sl.mp4:
    youtube: https://www.youtube.com/watch?v=lnv3D9GikCI
    source: youtube/e2e_sl.mp4
    start: 50
    end: 76
